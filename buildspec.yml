version: 0.2

phases:
  install:
    runtime-versions:
      php: 8.3
  pre_build:
    commands:
      - php --version
      - echo "Checking syntax..."
      - find . -name "*.php" -print0 | xargs -0 -n1 php -l
  build:
    commands:
      - echo "Running tests..."
      - php tests/test.php
      - echo "Running the app..."
      - php index.php
  post_build:
    commands:
      - echo "Build finished on $(date)"

artifacts:
  files:
    - index.php
  name: hello-php
